spring:
  application:
    name: danikwan
  datasource:
    url: jdbc:postgresql://localhost:5433/danikwan
    username: danikwan
    password: danikwan
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  cors:
    allowed-origins: http://localhost:4200

  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
      expiration-minutes: 120
    root:
      username: root
      email: root@danikwan.local
      password: ${ROOT_PASSWORD:}