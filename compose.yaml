services:
  postgres:
    image: postgres:16
    container_name: danikwan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: danikwan
      POSTGRES_USER: danikwan
      POSTGRES_PASSWORD: ${DB_PASSWORD:-danikwan}
    ports:
      - "5433:5432"
    volumes:
      - danikwan-data:/var/lib/postgresql/data

volumes:
  danikwan-data: